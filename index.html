(function () {
  var NS = "cardpicker:";
  window.storage = {
    get: function (key) {
      var raw = localStorage.getItem(NS + key);
      if (raw === null) return Promise.reject(new Error("not found"));
      return Promise.resolve({ key: key, value: raw });
    },
    set: function (key, value) {
      localStorage.setItem(NS + key, value);
      return Promise.resolve({ key: key, value: value });
    },
    delete: function (key) {
      var had = localStorage.getItem(NS + key) !== null;
      localStorage.removeItem(NS + key);
      return Promise.resolve({ key: key, deleted: had });
    },
    list: function (prefix) {
      var p = NS + (prefix || "");
      return Promise.resolve({
        keys: Object.keys(localStorage).filter(function (k) { return k.indexOf(p) === 0; })
          .map(function (k) { return k.slice(NS.length); })
      });
    }
  };
})();

function numberToKorean(num) {
  const n = Number(num);
  if (!n || isNaN(n) || n <= 0) return "";
  const digits = ["", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];
  const units = ["", "십", "백", "천"];
  const bigUnits = ["", "만", "억", "조"];
  
  let str = String(Math.floor(n));
  let len = str.length;
  let parts = [];
  
  for (let i = 0; i < len; i += 4) {
    let chunk = str.slice(Math.max(0, len - i - 4), len - i);
    let chunkKor = "";
    let cLen = chunk.length;
    
    for (let j = 0; j < cLen; j++) {
      let d = parseInt(chunk[j], 10);
      if (d > 0) {
        let u = units[cLen - 1 - j];
        let digitStr = digits[d];
        if (d === 1 && u !== "") digitStr = "";
        chunkKor += digitStr + u;
      }
    }
    if (chunkKor) {
      parts.unshift(chunkKor + bigUnits[i / 4]);
    }
  }
  return parts.join(" ") + "원";
}

const STORAGE_OTHER = "card-other-v1";

const fmt = (n) => Math.round(n).toLocaleString("ko-KR");
const yyyymm = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const prevYyyymm = (d) => yyyymm(new Date(d.getFullYear(), d.getMonth() - 1, 1));
/* 카드별 청구 주기 반영: 청구기간 = 전월 startDay ~ 당월 (startDay-1).
   따라서 이용일이 startDay 이후면 다음 달 청구분이 된다. */
const billedMonths = (dateStr, n, startDay) => {
    const d = new Date(dateStr);
    const sd = startDay || 1;
    let baseMonth = d.getMonth();
    if (d.getDate() >= sd) baseMonth += 1;
    const out = [];
    for (let i = 0; i < n; i++)
        out.push(yyyymm(new Date(d.getFullYear(), baseMonth + i, 1)));
    return out;
};
/* 다음 결제일이 속한 월. 25일이 지나면 다음 달로 넘어간다. */
const nextBillingMonth = (now) => {
    const m = now.getDate() > 25 ? now.getMonth() + 1 : now.getMonth();
    return yyyymm(new Date(now.getFullYear(), m, 1));
};
const nextMonthKey = (mk) => { const [y, m] = mk.split("-").map(Number); return yyyymm(new Date(y, m, 1)); };
const perInstallment = (amount, n) => Math.round(amount / (n || 1));
const tierIndexFor = (card, prevTotal) => {
    let idx = -1;
    for (let i = 0; i < card.tiers.length; i++)
        if (prevTotal >= card.tiers[i])
            idx = i;
    return idx;
};

function useSystemTheme() {
    const [dark, setDark] = useState(() => typeof window !== "undefined" && window.matchMedia
        ? window.matchMedia("(prefers-color-scheme: dark)").matches
        : true);
    useEffect(() => {
        if (!window.matchMedia)
            return;
        const mq = window.matchMedia("(prefers-color-scheme: dark)");
        const h = (e) => setDark(e.matches);
        mq.addEventListener ? mq.addEventListener("change", h) : mq.addListener(h);
        return () => { mq.removeEventListener ? mq.removeEventListener("change", h) : mq.removeListener(h); };
    }, []);
    return dark;
}

    const dark = useSystemTheme();

                if (c && c.value) setCards(JSON.parse(c.value));
            } catch (e) { }
            try {
                const t = await window.storage.get(STORAGE_TXNS, false);
                if (t && t.value) setTxns(JSON.parse(t.value));
                else throw new Error("empty");
            } catch (e) {
                // 최초 실행 시에만: 엑셀에서 가져온 8월 내역을 초기 데이터로 주입
                try {
                    const seeded = await window.storage.get(SEED_FLAG, false);

                    setTxns(SEED_TXNS);
                    try {
                        await window.storage.set(STORAGE_TXNS, JSON.stringify(SEED_TXNS), false);
                        await window.storage.set(SEED_FLAG, "1", false);
                    } catch (e3) { }
                }
            }
            try {
                const o = await window.storage.get(STORAGE_OTHER, false);
                if (o && o.value) setOtherBilling(JSON.parse(o.value));
            } catch (e) { }
            try {
                await window.storage.set("__probe", "1", false);
                const p = await window.storage.get("__probe", false);
                ok = !!(p && p.value === "1");
            } catch (e) { ok = false; }
            setStorageOk(ok);
            setLoaded(true);
        })();
    }, []);

    const persist = useCallback(async (key, value) => {
        try {
            const r = await window.storage.set(key, JSON.stringify(value), false);
            if (!r) { setStorageOk(false); return false; }
            setStorageOk(true);
            setLastSaved(new Date());
            return true;
        } catch (e) {
            setStorageOk(false);
            return false;
        }
    }, []);

    const saveCards = useCallback(async (next) => { setCards(next); await persist(STORAGE_CARDS, next); }, [persist]);
    const saveTxns = useCallback(async (next) => { setTxns(next); await persist(STORAGE_TXNS, next); }, [persist]);
    const saveOther = useCallback(async (next) => { setOtherBilling(next); await persist(STORAGE_OTHER, next); }, [persist]);

    const prevMonthTotals = useMemo(() => {
        const m = {};
        for (const c of cards) m[c.id] = (c.baselines && c.baselines[lastMonth]) || 0;
        for (const t of txns) if (t.date.slice(0, 7) === lastMonth) m[t.cardId] = (m[t.cardId] || 0) + t.amount;
        return m;
    }, [txns, cards, lastMonth]);

    const thisMonthTotals = useMemo(() => {
        const m = {};
        for (const c of cards) m[c.id] = (c.baselines && c.baselines[thisMonth]) || 0;
        for (const t of txns) if (t.date.slice(0, 7) === thisMonth) m[t.cardId] = (m[t.cardId] || 0) + t.amount;
        return m;
    }, [txns, cards, thisMonth]);

    const buildUsage = useCallback((cardId, excludeId) => {
        const card = cards.find((c) => c.id === cardId);
        const u = { total: 0, byGroup: {}, byGroupDay: {} };
        if (!card) return u;
        for (const t of txns) {
            if (t.cardId !== cardId || t.id === excludeId) continue;
            if (t.date.slice(0, 7) !== thisMonth) continue;
            const used = t.capUsed || 0;
            u.total += used;
            const g = card.rates[t.category] && card.rates[t.category].group;
            if (g) {
                u.byGroup[g] = (u.byGroup[g] || 0) + used;
                const k = `${g}|${t.date}`;
                u.byGroupDay[k] = (u.byGroupDay[k] || 0) + used;
            }
        }
        return u;
    }, [txns, cards, thisMonth]);

    const usageByCard = useMemo(() => {
        const m = {};
        for (const c of cards) m[c.id] = buildUsage(c.id, null);
        return m;
    }, [cards, buildUsage]);

    const tierInfo = useCallback((card) => {
        const prevTotal = prevMonthTotals[card.id] || 0;
        const idx = tierIndexFor(card, prevTotal);
        return {
            idx, active: idx >= 0, prevTotal,
            nextThreshold: idx + 1 < card.tiers.length ? card.tiers[idx + 1] : null,
        };
    }, [prevMonthTotals]);

    const remainingCap = useCallback((card, cat, tIdx, u, dateStr) => {
        const info = card.rates[cat];
        if (!info) return 0;
        let rem = Infinity;
        if (info.group && card.groups[info.group]) {
            const g = card.groups[info.group];
            const gCap = g.caps[tIdx];
            if (gCap != null) rem = Math.min(rem, Math.max(gCap - (u.byGroup[info.group] || 0), 0));
            if (g.dailyCap != null) {
                const usedToday = u.byGroupDay[`${info.group}|${dateStr}`] || 0;
                rem = Math.min(rem, Math.max(g.dailyCap - usedToday, 0));
            }
        }
        const oCap = card.overallCaps ? card.overallCaps[tIdx] : null;
        if (oCap != null) rem = Math.min(rem, Math.max(oCap - u.total, 0));
        return rem;
    }, []);

    const calcRewardRaw = useCallback((card, cat, amt, tIdx, u, dateStr, instMonths) => {
        if (!amt || amt <= 0) return { rewardValue: 0, capUsed: 0, detail: "", notes: [] };
        if (card.excludeInstallment && (instMonths || 1) > 1)
            return { rewardValue: 0, capUsed: 0, detail: "할부 결제는 적립/할인 대상이 아니에요", notes: [] };
        if (tIdx < 0) return { rewardValue: 0, capUsed: 0, detail: "전월실적 미충족 — 이번 달 혜택 비활성", notes: [] };
        const info = card.rates[cat];
        const notes = [];
        const rem = remainingCap(card, cat, tIdx, u, dateStr);
        let eligible = amt;
        if (info && info.perTxnCap != null && amt > info.perTxnCap) {
            eligible = info.perTxnCap;
            notes.push(`1회 ${fmt(info.perTxnCap)}원까지만 인정돼요`);
        }
        if (card.mileageMode) {
            if (!info || !info.miles) return { rewardValue: 0, capUsed: 0, detail: "적립 대상 아님", notes };
            const bonus = info.miles;
            const full = Math.floor(eligible / 1000) * bonus;
            let earned, capUsed;
            if (rem === Infinity) { earned = full; capUsed = 0; }
            else if (full <= rem) { earned = full; capUsed = full; }
            else {
                const bonusAmt = (rem / bonus) * 1000;
                earned = rem + Math.floor((eligible - bonusAmt) / 1000);
                capUsed = rem;
                notes.push("특별적립 한도 초과분은 기본 1마일만 적립");
            }
            const value = earned * (card.mileageValue || 15);
            return {
                rewardValue: value, capUsed, notes,
                detail: `약 ${fmt(earned)}마일 · 마일당 ${card.mileageValue}원 가정 시 ${fmt(value)}원어치`,
            };
        }
        if (!info || !info.rate) return { rewardValue: 0, capUsed: 0, detail: "혜택 대상 아님", notes };
        const raw = (eligible * info.rate) / 100;
        const reward = rem === Infinity ? raw : Math.min(raw, rem);
        if (rem !== Infinity && raw > rem) notes.push("이번 달 남은 한도까지만 적립돼요");
        return {
            rewardValue: reward, capUsed: rem === Infinity ? 0 : reward, notes,
            detail: `${info.rate}%${rem === Infinity ? " (한도 없음)" : ` · 남은 한도 ${fmt(rem)}원`}`,
        };
    }, [remainingCap]);

    const calcReward = useCallback((card, cat, amt) => {
        const t = tierInfo(card);
        const u = usageByCard[card.id] || { total: 0, byGroup: {}, byGroupDay: {} };
        return { ...calcRewardRaw(card, cat, amt, t.active ? t.idx : -1, u, today, months), tInfo: t };
    }, [tierInfo, usageByCard, calcRewardRaw, today, months]);

    const capWarnings = useMemo(() => {
        const out = [];
        for (const c of cards) {
            const info = c.rates[category];
            if (!info || (c.mileageMode ? !info.miles : !info.rate)) continue;
            const t = tierInfo(c);
            const u = usageByCard[c.id] || { total: 0, byGroup: {}, byGroupDay: {} };
            if (!t.active) {
                if (c.tiers[0] > 0)
                    out.push({ tone: "off", text: `${c.name}은 전월실적 미충족으로 이번 달 혜택이 꺼져 있어요. (지난달 ${fmt(t.prevTotal)}원 / 기준 ${fmt(c.tiers[0])}원)` });
                continue;
            }
            const rem = remainingCap(c, category, t.idx, u, today);
            if (rem !== Infinity && rem <= 0) {
                const g = info.group;
                const gDef = g ? c.groups[g] : null;
                const dayHit = gDef && gDef.dailyCap != null && (u.byGroupDay[`${g}|${today}`] || 0) >= gDef.dailyCap;
                if (dayHit) {
                    out.push({ tone: "capped", text: `${c.name}의 ${g} 오늘치 적립 한도(${fmt(gDef.dailyCap)}P)를 다 썼어요. 내일 결제하면 다시 적립돼요.` });
                } else if (t.nextThreshold) {
                    const need = Math.max(t.nextThreshold - (thisMonthTotals[c.id] || 0), 0);
                    out.push({ tone: "capped", text: `${c.name}의 현재 실적 구간에서 ${category} 최대 적립 한도를 이미 달성했습니다. (다음 실적 구간까지 ${fmt(need)}원 결제 필요)` });
